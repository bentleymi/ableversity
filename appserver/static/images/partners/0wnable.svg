<svg width="700" height="400" viewBox="0 0 700 400" xmlns="http://www.w3.org/2000/svg">
  <!-- White Background (Remove for transparent) -->
  <rect width="700" height="400" fill="#FFFFFF"/>

  <!-- The "$" Symbol -->
  <text x="30" y="245" 
        font-family="'Barlow Condensed', 'Arial Narrow', 'Helvetica', sans-serif" 
        font-weight="700" 
        font-size="110" 
        fill="#111111">
    $
  </text>

  <!-- The "0" Symbol (Old School Terminal Zero - No slash) -->
  <!-- Slightly narrower oval shape to look like a terminal zero -->
  <ellipse cx="170" cy="200" rx="65" ry="80" fill="#E05C1A"/>
  <ellipse cx="170" cy="200" rx="38" ry="52" fill="#FFFFFF"/>

  <!-- The Text "wnable" -->
  <text x="240" y="245" 
        font-family="'Barlow Condensed', 'Arial Narrow', 'Helvetica', sans-serif" 
        font-weight="700" 
        font-size="110" 
        fill="#111111" 
        letter-spacing="-2">
    wnable
  </text>
</svg>